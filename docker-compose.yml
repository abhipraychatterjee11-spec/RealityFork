services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realityfork
      POSTGRES_PASSWORD: realityfork
      POSTGRES_DB: realityfork
    ports:
      - "5432:5432"
    volumes:
      - realityfork_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: realityfork
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - realityfork_minio:/data

volumes:
  realityfork_postgres:
  realityfork_minio:

